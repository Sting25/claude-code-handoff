name: lint

# Copy to your project as `.github/workflows/lint.yml`.
# Mirrors the pre-commit hook server-side via the same lib/check-* scripts —
# the hook and CI can never drift because they share one implementation.
# Adjust Python / Node versions per project.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  python:
    # Detection runs as a step (after checkout), NOT a job-level `if:`.
    # `hashFiles()` is only valid once a runner is assigned and the repo is
    # checked out — using it in a job-level `if:` makes GitHub reject the
    # WHOLE workflow as invalid, silently disabling every job including
    # guardrails. The job always starts; its tool steps no-op when the
    # configs are absent (frontend-only repos see a green, empty python job).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false  # don't leave GITHUB_TOKEN in .git/config
      - id: detect
        run: |
          if [ -f ruff.toml ] || [ -f pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - if: steps.detect.outputs.present == 'true'
        run: pip install ruff
      - if: steps.detect.outputs.present == 'true'
        run: ruff check .

  frontend:
    # Same pattern as `python` — detect in a step, not a job-level `if:`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false  # don't leave GITHUB_TOKEN in .git/config
      - id: detect
        run: |
          if [ -f eslint.config.js ] || [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        # Frozen-lockfile install when a lockfile exists (reproducible, and it
        # hard-fails on lockfile drift instead of silently mutating it like
        # `npm install`). Falls back to `npm install` only when there's no
        # lockfile, so a lockfile-less repo still works. pnpm/yarn equivalents:
        # `pnpm install --frozen-lockfile --ignore-scripts` /
        # `yarn install --immutable --mode=skip-build`.
        #
        # --ignore-scripts: eslint and tsc are pure JS, so the lint job never
        # needs a dependency's install hooks — and this runner holds GITHUB_TOKEN
        # and repo/org secrets, the exact target the Shai-Hulud 2.0 preinstall
        # worm went after. Not executing arbitrary pre/postinstall scripts is
        # cheap CI hardening. Escape hatch: if a dep your lint chain genuinely
        # needs builds a native binary in a lifecycle script (esbuild, @swc/core,
        # sharp, cypress), add a follow-up `npm rebuild <pkg>` step rather than
        # dropping the flag.
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --ignore-scripts
          else
            echo "no package-lock.json — using npm install (add a lockfile for reproducible CI)"
            npm install --ignore-scripts
          fi
      - if: steps.detect.outputs.present == 'true'
        run: npx eslint .
      - name: Type-check (tsc --noEmit)
        if: steps.detect.outputs.present == 'true'
        # Project-wide type-check, guarded: only runs when a tsconfig.json is
        # present AND TypeScript is installed — mirrors the pre-commit hook so
        # the two layers stay in lockstep. coding-rules.md rule 9 mandates a
        # type-checker; this is where it runs server-side.
        run: |
          if [ -f tsconfig.json ] && npx --no-install tsc --version >/dev/null 2>&1; then
            npx --no-install tsc --noEmit
          else
            echo "tsconfig.json or typescript missing — skipping tsc type-check"
          fi

  php:
    # Same detect-in-a-step pattern as `python` / `frontend`. No-ops on repos
    # with no PHP, so it's safe to leave enabled in a polyglot org.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false  # don't leave GITHUB_TOKEN in .git/config
      - id: detect
        run: |
          if [ -f composer.json ] || git ls-files '*.php' '*.phtml' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: "8.3"
          tools: composer
      - name: Lint PHP (php -l syntax; phpcs when configured)
        if: steps.detect.outputs.present == 'true'
        run: |
          fail=0
          git ls-files -z '*.php' '*.phtml' | xargs -0 -r -n1 php -l >/dev/null || fail=1
          if [ -f composer.json ] && [ -f composer.lock ]; then
            composer install --no-interaction --no-progress --prefer-dist || true
          fi
          if [ -x vendor/bin/phpcs ]; then vendor/bin/phpcs || fail=1; fi
          exit $fail

  # ── OPT-IN linter jobs for other languages ────────────────────────────────
  # The forbidden-pattern + secret + size + hygiene guardrails below already run
  # for EVERY language. These jobs add each language's real linter/type-checker.
  # Uncomment the ones your team uses (actions are pinned to a commit SHA; the
  # trailing comment is the version — bump via Dependabot). Each no-ops on repos
  # that don't use that language.
  #
  # go:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
  #       with:
  #         persist-credentials: false
  #     - id: detect
  #       run: '[ -f go.mod ] && echo "present=true" >> "$GITHUB_OUTPUT" || true'
  #     - if: steps.detect.outputs.present == 'true'
  #       uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
  #       with:
  #         go-version: stable
  #     - if: steps.detect.outputs.present == 'true'
  #       run: go vet ./...
  #     - if: steps.detect.outputs.present == 'true'
  #       uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee  # v9.2.1
  #
  # rust:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
  #       with:
  #         persist-credentials: false
  #     - id: detect
  #       run: '[ -f Cargo.toml ] && echo "present=true" >> "$GITHUB_OUTPUT" || true'
  #     - if: steps.detect.outputs.present == 'true'
  #       uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
  #       with:
  #         components: clippy
  #     - if: steps.detect.outputs.present == 'true'
  #       run: cargo clippy --all-targets -- -D warnings
  #
  # java:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
  #       with:
  #         persist-credentials: false
  #     - id: detect
  #       run: '{ [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; } && echo "present=true" >> "$GITHUB_OUTPUT" || true'
